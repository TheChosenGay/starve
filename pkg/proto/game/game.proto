syntax = "proto3";

package starve.game.v1;

option go_package = "starve/pkg/proto/game";

// M5 玩法层契约：组件（Go 组件的传输形态）+ 快照消息。
// Go 侧组件是纯 struct（无锁），codec 负责 Go struct ⇄ 本文件消息。

// ---- 组件 ----

message Position {
  int32 x = 1;
  int32 y = 2;
}

// Moveable 可移动实体（玩家）的 tick 制移动状态：
// move 命令是方向步进，进 Queue 缓存；MoveSystem 每 tick 按步进间隔消费队首。
message Moveable {
  int32 interval = 1; // 基础步进间隔（tick/格，如 2 = 每 2 tick 走一格）
  int32 elapsed = 2;  // 距上次移动经过的 tick 数
  repeated MoveDir queue = 3; // 待执行方向（顺序应用；收到 0,0 停止命令时清空）
}

message MoveDir {
  int32 dx = 1;
  int32 dy = 2;
}

message Health {
  int32 cur = 1;
  int32 max = 2;
}

message Hunger {
  int32 level = 1;
  int32 rate = 2; // 每 tick 消耗速率（0 表示用世界默认）
}

message Growable {
  int32 stage = 1;
  int32 ticks = 2; // 距上次生长经过的 tick 数
}

// Dead 死亡标记：实体死后保留在世界上（尸体/幽灵状态），由后续系统处理。
message Dead {
  string reason = 1;
  int64 since_tick = 2; // 死亡起始世界 tick（尸体清理用；旧档为 0 时世界自动补盖）
}

// Player 玩家标记：把 UID（账号）挂到实体上，快照携带，加载时重建所有权表。
message Player {
  string uid = 1;
}

// Offline 离线标记：断线后实体保留在世界上（断线保留 N 分钟），重连复用。
message Offline {
  int64 since_tick = 1; // 离线起始世界 tick（用于超时清理）
}

// ItemKind 物品/实体类型（稳定 ID）：资源、工具等共用一个枚举。
// 新类型 = 新枚举值 + 模板表条目（样式/颜色/掉落等静态属性在模板表，不在枚举）。
enum ItemKind {
  ITEM_KIND_UNSPECIFIED = 0;
  // 资源段 1-99
  ITEM_KIND_BERRY = 1;
  ITEM_KIND_WOOD = 2;
  ITEM_KIND_FLINT = 3;
  ITEM_KIND_MEAT = 4; // 肉（生物掉落）
  // 工具段 100-199
  ITEM_KIND_AXE = 100;     // 工具（砍伐）
  ITEM_KIND_PICKAXE = 101; // 工具（挖掘）
}

// CreatureKind 生物类型（稳定 ID；配置用名字，内部用枚举）。
enum CreatureKind {
  CREATURE_KIND_UNSPECIFIED = 0;
  CREATURE_KIND_RABBIT = 1; // 兔子（被动，游荡 + 掉肉）
  CREATURE_KIND_WOLF = 2;   // 狼（主动：仇恨 + 追击 + 攻击）
  CREATURE_KIND_BOAR = 3;   // 野猪（高血量近战）
  CREATURE_KIND_DEER = 4;   // 鹿（被动，遇敌逃跑）
  CREATURE_KIND_SPIDER = 5; // 蜘蛛（低血量快攻）
}

// BuildingKind 建筑类型（稳定 ID；配置用名字，内部用枚举）。
enum BuildingKind {
  BUILDING_KIND_UNSPECIFIED = 0;
  BUILDING_KIND_CAMPFIRE = 1; // 火堆：放置后挂 HeatSource（供暖/降雾）
  BUILDING_KIND_WALL = 2;     // 木墙：阻挡移动/寻路
}

// Building 建筑组件：kind 类型 + 占格尺寸（宽×高）+ placed 是否已放置。
// 未放置：无 Position、不阻挡（蓝图/物品态）；Place(pos) 后补 Position 并逐格 SetBlocked。
message Building {
  BuildingKind kind = 1;
  int32 width = 2;
  int32 height = 3;
  bool placed = 4;
}

// WorkAction 可交互动作（目标声明能被什么动作处理，工具声明做什么动作）。
enum WorkAction {
  WORK_ACTION_UNSPECIFIED = 0;
  WORK_ACTION_CHOP = 1; // 砍伐（树）
  WORK_ACTION_MINE = 2; // 挖掘（矿）
  WORK_ACTION_PICK = 3; // 采集（浆果丛）
}

// Workable 可交互环境物（树/矿/浆果丛）：动作 + 剩余工作量。
// 用 WorkLeft 表达耐久（不用 Combat Health）：砍伐/挖掘/采集走工作量，
// 生物才用 Health——两条伤害通道互不干扰。
message Workable {
  ItemKind kind = 1;        // 实体类型（掉落/模板查找用）
  WorkAction action = 2;    // 能被什么动作处理
  int32 work_left = 3;
  int32 max_work = 4;
}

// ThreatEntry 仇恨表一条：目标实体 + 威胁值。
message ThreatEntry {
  uint64 entity_id = 1;
  int32 threat = 2;
}

// Creature 生物身份与长期状态：类型 + 仇恨表 + 出生点/游荡 + 掉落。
// 行为状态在 AI 组件，攻击能力在 Weapon 组件。
message Creature {
  CreatureKind kind = 1;
  repeated ThreatEntry threats = 2;  // 仇恨表（谁打了它/谁靠近它）
  int32 home_x = 3;                  // 出生点（游荡锚点，回防用）
  int32 home_y = 4;
  int32 roam_radius = 5;
  repeated ItemStack drops = 6;      // 死亡掉落
}

// AI 生物行为状态机（idle/chase/attack/flee）+ 受击标记。
// LastHitBy/LastHitAt：受击事件以"字段 + tick 窗口"表达，过期即失效，无需主动清空。
message AI {
  int32 state = 1;                   // CreatureState（0=idle 1=chase 2=attack 3=flee）
  uint64 target = 2;                 // 当前目标（0 = 无）
  int32 flee_hp = 3;                 // 血量 <= 此值切 flee（0 = 永不逃跑）
  uint64 last_hit_by = 4;            // 最近一次被谁打（0 = 无）
  int32 last_hit_at = 5;             // 被打时的世界 tick
  int32 hit_memory_ticks = 6;        // 受击记忆窗口（tick）
  int32 cooldown = 7;                // 攻击冷却剩余 tick
  repeated CreatureKind hostile_kinds = 8; // 视为敌对的生物类型（玩家隐式敌对）
  bool hostile_players = 9;          // 玩家是否视为敌对（false = 友好，不主动攻击玩家）
}

// Weapon 攻击能力（范围/伤害/冷却；生物生成时从模板挂，玩家装备武器后续复用）。
message Weapon {
  int32 attack_range = 1;
  int32 attack_damage = 2;
  int32 attack_cooldown = 3; // 攻击间隔（tick）
}

// AOI 感知组件：radius = 感知半径（正方形，模板拷贝）；visible = 本 tick 感知到的
// liveable（派生数据，AOISystem 每 tick 重算；debug 模式才编码进快照）。
message AOI {
  int32 radius = 1;
  repeated uint64 visible = 2;
}

// Equipped 玩家当前手持的工具（kind=0 表示徒手）。
message Equipped {
  ItemKind kind = 1;
}

// Respawn 重生标记：有该组件的环境物在耗尽后会自动恢复（如浆果丛重新长出）。
message Respawn {
  int64 ticks = 1; // 剩余倒计时（tick）
}

// WorkstationType 工作站类型（稳定 ID）。
enum WorkstationType {
  WORKSTATION_TYPE_UNSPECIFIED = 0;
  WORKSTATION_TYPE_CAMPFIRE = 1;   // 火堆
  WORKSTATION_TYPE_WORKBENCH = 2;  // 工作台
}

// Workstation 工作站标记：某些配方要求玩家附近有指定类型的工作站。
message Workstation {
  WorkstationType type = 1;
}

// Crafting 制作中的状态（挂在玩家身上）：配方 + 剩余 tick。
message Crafting {
  string recipe_id = 1;
  int64 ticks_left = 2;
  repeated ItemStack ingredients = 3; // 打断退款用（craft 开始时从配方拷贝）
}

// EffectOrder 效果类型 + 确定性应用顺序（枚举值即结算顺序，越小越先）。
// 效果的强度走 EffectInstance.param（配置/发射器携带），效果实现按 param 结算，
// 同一效果只写一个枚举值（如加速/减速都是 SPEED，param 正负决定方向）。
// 新效果：加枚举值 + 在组件包实现 Effect 接口并在 init 注册，零改动系统。
enum EffectOrder {
  EFFECT_ORDER_UNSPECIFIED = 0;
  EFFECT_ORDER_SPEED = 1;    // 速度修正：param = 百分比（正=加速，负=减速）
  EFFECT_ORDER_POISON = 2;   // 中毒：param = 每 tick 扣血量（0 = 默认 1）
  EFFECT_ORDER_COLD = 3;     // 寒冷：param = 每 tick 冻伤量（天气派生）
  EFFECT_ORDER_HEAT = 4;     // 炎热：param = 每 tick 中暑量（天气派生）
}

// EffectInstance 一个效果实例：类型 + 参数（如毒伤量、速度修正百分比）。
message EffectInstance {
  EffectOrder order = 1;
  int32 param = 2;
}

// EffectActive 单个效果的覆盖状态：多来源计数 + 聚合参数（多来源求和）。
message EffectActive {
  EffectOrder order = 1;
  int32 count = 2;
  int32 param = 3;
}

// Effects 实体当前生效效果（挂在玩家身上；进快照，客户端渲染 buff/debuff 图标）。
message Effects {
  repeated EffectActive active = 1;
}

// EffectEmitter 效果发射器（植物/火堆等实体挂载）：
// effects 为效果集合，radius 为作用半径（0 = 仅影响自身所在格）。
message EffectEmitter {
  repeated EffectInstance effects = 1;
  int32 radius = 2;
}

// Season 季节（由世界时钟推导，随存档自动恢复）。
enum Season {
  SEASON_UNSPECIFIED = 0;
  SEASON_SPRING = 1;
  SEASON_SUMMER = 2;
  SEASON_AUTUMN = 3;
  SEASON_WINTER = 4;
}

// WeatherState 天气世界状态（随快照下发/存档；phase 驱动确定性采样）。
message WeatherState {
  int64 phase = 1;  // 时间相位（世界 tick）
  Season season = 2; // 由 phase 推导（冗余给客户端显示）
}

// Fan 风扇：局部风力修正 + 下风向雾密度降低（实体组件）。
message Fan {
  int32 strength = 1; // 风力（叠加到风速）
  int32 dir_x = 2;    // 风向（-1/0/1，采样时归一化）
  int32 dir_y = 3;
  int32 radius = 4;
}

// HeatSource 热源（火堆等）：局部升温 + 降雾（实体组件）。
message HeatSource {
  int32 strength = 1; // 升温量
  int32 radius = 2;
}

// WeatherBias 区域天气基值（biome 配置，服务端内部；随存档保存）。
message WeatherBias {
  float temp = 1; // 温度偏移
  float fog = 2;  // 雾密度偏移
  float rain = 3; // 降雨偏移
}

// WeatherCell 天气网格单元（粗粒度：一个单元覆盖 cell_size × cell_size 世界格）。
message WeatherCell {
  float fog = 1;         // 0..1（客户端按值叠加雾层透明度）
  float rain = 2;        // 0..1（客户端按值决定雨粒子密度/速度）
  float temperature = 3; // 摄氏度（客户端可做季节色调/结冰效果）
}

// WeatherFrame 天气帧（服务端 → 客户端，周期推送）：客户端据此渲染雾/雨/风向。
// cells 行优先，共 cells_per_row × (总格数 / cell_size) 个单元，覆盖全图。
message WeatherFrame {
  Season season = 1;
  int32 cell_size = 2;       // 每个采样单元覆盖的世界格数（如 10 = 10×10 一格）
  int32 cells_per_row = 3;   // 每行单元数
  repeated WeatherCell cells = 4;
  float wind_dir_x = 5;      // 全局风向（单位向量）
  float wind_dir_y = 6;
  float wind_speed = 7;      // 全局风速（雨粒子漂移/旗帜摆动用）
}

// ---- 世界配置（登录时推送 world.config，客户端据此渲染模板/配方/工作站） ----

message ToolConfig {
  WorkAction action = 1;
  int32 efficiency = 2;
  int32 durability = 3;
}

message UseEffectConfig {
  int32 hunger = 1;
  int32 health = 2;
}

message DropConfig {
  ItemKind kind = 1;
  int32 count = 2;
}

message TemplateConfig {
  ItemKind kind = 1;
  string name = 2;
  string color = 3;
  int32 stack_size = 4;
  int32 respawn_ticks = 5;
  ToolConfig tool = 6;
  UseEffectConfig use_effect = 7;
  repeated DropConfig drop_table = 8;
}

message ItemRefConfig {
  ItemKind kind = 1;
  int32 count = 2;
}

message RecipeConfig {
  string id = 1;
  WorkstationType workstation = 2; // 0 = 徒手可做
  int32 ticks = 3;
  ItemRefConfig output = 4;
  repeated ItemRefConfig ingredients = 5;
}

message StationConfig {
  WorkstationType type = 1;
  int32 x = 2;
  int32 y = 3;
}

// TerrainType 地形类型（角粒度，客户端按枚举映射颜色/贴图，零代码扩展）。
enum TerrainType {
  TERRAIN_TYPE_UNSPECIFIED = 0;
  TERRAIN_TYPE_WATER = 1;
  TERRAIN_TYPE_SAND = 2;
  TERRAIN_TYPE_GRASS = 3;
  TERRAIN_TYPE_ROCK = 4;
  TERRAIN_TYPE_SNOW = 5;
}

// BiomeType 生物群系类型（稳定 ID；配置里用名字，内部统一用枚举）。
// 新群系 = 加枚举值 + biomes.json 加一项 + biomeTypeByName 加一行。
enum BiomeType {
  BIOME_TYPE_UNSPECIFIED = 0;
  BIOME_TYPE_GRASSLAND = 1; // 草原（出生区）
  BIOME_TYPE_FOREST = 2;    // 森林
  BIOME_TYPE_SWAMP = 3;     // 沼泽
  BIOME_TYPE_SNOWLAND = 4;  // 雪原
  BIOME_TYPE_MINE = 5;      // 矿区
}

// MapConfig 地形高度场（静态，登录随 world.config 下发、随存档保存/恢复）。
// corner_heights/corner_types 都是 (width+1)×(height+1) 个字节，行优先。
message MapConfig {
  int32 width = 1;           // 格子列数
  int32 height = 2;          // 格子行数
  bytes corner_heights = 3;  // 每角高度 0~255
  bytes corner_types = 4;    // 每角 TerrainType 枚举值
  int32 spawn_x = 5;
  int32 spawn_y = 6;
}

// GameConfig 世界配置的端上契约（模板/配方/工作站），登录后推送给客户端。
message GameConfig {
  repeated TemplateConfig templates = 1;
  repeated RecipeConfig recipes = 2;
  repeated StationConfig stations = 3;
  int32 inventory_slots = 4; // 背包格数（客户端渲染格子面板用）
  MapConfig map = 5;         // 地形高度场（静态，随存档恢复）
  repeated BuildingConfig buildings = 6; // 建筑模板表（kind → 占格尺寸，客户端幽灵预览用）
}

// BuildingConfig 建筑模板（buildings.json → world.config 推送）。
message BuildingConfig {
  BuildingKind kind = 1;
  string name = 2;
  int32 width = 3;  // 占格宽度（左上角锚点向右）
  int32 height = 4; // 占格高度（左上角锚点向下）
}

// ItemStack 物品堆叠：kind + 数量 + 堆叠上限（上限 0 = 用模板默认）。
// 枚举键不能用 map，用 repeated 表达。
message ItemStack {
  ItemKind kind = 1;
  int32 count = 2;
  int32 max_stack = 3;
  int32 durability = 4; // 工具剩余耐久（非工具为 0）
}

// Inventory 玩家背包：物品堆叠列表（M5 二期最小形态；后续再加容量/槽位）。
// Inventory 玩家背包：槽位数组（固定容量，空槽 = 空 ItemStack）。
message Inventory {
  repeated ItemStack items = 1; // 顺序 = 槽位顺序（含空槽）
}

// Loot 掉落物（死亡/砍伐实体就地转化）：捡走即消失。
message Loot {
  repeated ItemStack items = 1;
}

// DayCycle 是世界级状态（Resource 的传输形态），不是实体组件。
message DayCycle {
  int32 phase = 1;
  float light = 2; // 0..1 光照
}

// ---- 快照 ----

message ComponentState {
  string component = 1; // 组件名（如 "Health"），客户端按名解析
  bytes  data = 2;      // 组件值（codec 编码，protobuf）
}

message EntityState {
  uint64 entity_id = 1;
  repeated ComponentState components = 2;
}

// RemovedComponent 本 tick 被移除的组件（实体保留，如资源耗尽）。
message RemovedComponent {
  uint64 entity_id = 1;
  repeated string components = 2; // 组件名，如 "Gatherable"
}

// 全量快照：登录/重连时发给单个客户端（重建本地实体表）。
message Snapshot {
  repeated EntityState entities = 1;
  DayCycle day_cycle = 2; // 世界级状态（昼夜）
  WeatherState weather = 3; // 世界级状态（天气相位/季节）
}

// 增量快照：每 tick 从 dirty 生成，广播（更新/删除）。
message SnapshotDelta {
  repeated EntityState entities = 1;
  repeated uint64 removed_entities = 2; // 本 tick 销毁的实体
  DayCycle day_cycle = 3; // 世界级状态（昼夜）
  repeated RemovedComponent removed_components = 4; // 本 tick 被移除的组件
  WeatherState weather = 5; // 世界级状态（天气相位/季节）
}

// ---- 存档 ----

// WorldMeta 存档的世界元数据（实体 ID 分配状态 + 世界时钟）。
message WorldMeta {
  uint64 tick = 1;           // 世界时钟（tick 数）
  uint64 next_entity_id = 2; // 实体 ID 分配游标
  repeated uint64 free_ids = 3; // 空闲 ID（销毁回收）
  string version = 4;        // 存档版本
  uint64 map_seed = 5;       // 地图生成种子（重放/复现用）
}

// SaveData 存档文件 = 全量快照 + 世界元数据。
message SaveData {
  Snapshot snapshot = 1;
  WorldMeta meta = 2;
  bytes journal = 3; // 指令日志（JSON 序列化，见 internal/game/world/command.go）
  MapConfig map = 4; // 地形高度场（静态，随存档恢复）
  bytes tile_effects = 5; // W×H 每格效果 id（服务端内部，随档保存，不下发客户端）
  bytes tile_params = 6;  // W×H 每格效果参数（服务端内部，随档保存，不下发客户端）
  bytes tile_regions = 7;              // W×H 每格区域实例 id（1-based；0=未分配；服务端内部）
  repeated WeatherBias region_weather = 8; // 区域天气基值（索引 = 区域实例 id）
}
