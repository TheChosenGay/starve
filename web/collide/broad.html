<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>starve · 宽阶段压测：扫描器 vs 暴力 (Go/WASM)</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #14161c; color: #e6e8ee;
    font: 13px/1.5 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex; flex-direction: column; height: 100vh;
  }
  header { padding: 10px 14px; border-bottom: 1px solid #262a35; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  h1 { font-size: 14px; margin: 0; font-weight: 600; }
  .ctl { display: flex; gap: 6px; align-items: center; }
  .ctl label { color: #8b93a7; }
  input[type=range] { width: 110px; }
  button { background: #222634; color: #cfd3dd; border: 1px solid #333a4a; padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 12px; }
  button:hover { background: #2a3040; }
  button.on { background: #2f6df6; border-color: #2f6df6; color: #fff; }
  a { color: #6ea8fe; text-decoration: none; font-size: 12px; }
  main { flex: 1; position: relative; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
  .hud {
    position: absolute; left: 14px; bottom: 14px; background: #1b1f29e6;
    border: 1px solid #333a4a; border-radius: 8px; padding: 10px 12px; min-width: 520px;
  }
  .hud table { border-collapse: collapse; width: 100%; }
  .hud td { padding: 2px 8px 2px 0; white-space: nowrap; }
  .hud .num { text-align: right; font-variant-numeric: tabular-nums; }
  .hud b { color: #7fd18b; }
  .hud .bad { color: #ff7b72; }
  .hud .warn { color: #ffd866; }
  .hud small { color: #8b93a7; display: block; margin-top: 6px; }
  .hud .step { color: #c3c9d6; margin: 2px 0; }
  .hud td small { display: block; color: #8b93a7; }
  .hud .tag { font-size: 11px; color: #8b93a7; border: 1px solid #333a4a; border-radius: 4px; padding: 0 4px; }
  .hud .tag.ok { color: #7fd18b; border-color: #2f5d3f; }
  .bar { height: 8px; border-radius: 4px; background: #2a3040; position: relative; overflow: hidden; }
  .bar i { display: block; height: 100%; background: #2f6df6; }
  .bar.ok i { background: #3fbf6f; }
  .bar.hot i { background: #ff5c52; }
</style>
</head>
<body>
<header>
  <h1>宽阶段压测 · 扫描器 vs 暴力</h1>
  <div class="ctl">
    <label for="n">物体</label>
    <input id="n" type="range" min="0" max="8" step="1" value="3">
    <span id="nv">2000</span>
  </div>
  <div class="ctl">
    <label for="q">每帧查询</label>
    <input id="q" type="range" min="1" max="128" step="1" value="32">
    <span id="qv">32</span>
  </div>
  <div class="ctl">
    <label for="d">移动比例</label>
    <input id="d" type="range" min="0" max="1" step="0.05" value="0.2">
    <span id="dv">20%</span>
  </div>
  <button id="rebuild">索引：增量更新</button>
  <button id="pause">暂停</button>
  <button id="reset">重建场景</button>
  <a href="index.html">基础图元</a>
  <a href="scenes.html">命中场景</a>
  <a href="sim.html">掉落压测</a>
  <a href="swing.html">挥砍扇形</a>
  <a href="arena.html">竖劈竞技场</a>
  <a href="blast.html">丢炸弹</a>
</header>
<main>
  <canvas id="c"></canvas>
  <div class="hud" id="hud"></div>
</main>
<script src="wasm_exec.js?v=9"></script>
<script src="broad.js?v=9"></script>
</body>
</html>
