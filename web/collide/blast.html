<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>starve · 丢炸弹 (Go/WASM)</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #14161c; color: #e6e8ee;
    font: 13px/1.5 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex; flex-direction: column; height: 100vh;
  }
  header { padding: 10px 14px; border-bottom: 1px solid #262a35; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  h1 { font-size: 14px; margin: 0; font-weight: 600; }
  .ctl { display: flex; gap: 6px; align-items: center; }
  .ctl label { color: #8b93a7; }
  input[type=range] { width: 104px; }
  button { background: #222634; color: #cfd3dd; border: 1px solid #333a4a; padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 12px; }
  button:hover { background: #2a3040; }
  button.on { background: #2f6df6; border-color: #2f6df6; color: #fff; }
  a { color: #6ea8fe; text-decoration: none; font-size: 12px; }
  main { flex: 1; position: relative; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }
  .hud {
    position: absolute; left: 14px; bottom: 14px; background: #1b1f29e6;
    border: 1px solid #333a4a; border-radius: 8px; padding: 10px 12px; min-width: 380px;
  }
  .hud b { color: #7fd18b; }
  .hud .hit { color: #ff7b72; }
  .hud small { color: #8b93a7; display: block; margin-top: 6px; }
  .hud .row { font-variant-numeric: tabular-nums; }
  .tip {
    position: absolute; right: 14px; bottom: 14px; background: #1b1f29e6;
    border: 1px solid #333a4a; border-radius: 8px; padding: 8px 12px; color: #8b93a7;
  }
  .tip b { color: #ffd866; }
</style>
</head>
<body>
<header>
  <h1>丢炸弹 · 点地面投掷</h1>
  <div class="ctl">
    <label for="rad">半径</label>
    <input id="rad" type="range" min="1" max="8" step="0.1" value="4">
    <span id="radv">4.0</span>
  </div>
  <div class="ctl">
    <label for="fuse">引信</label>
    <input id="fuse" type="range" min="0.1" max="2" step="0.05" value="0.7">
    <span id="fusev">0.70</span>
  </div>
  <div class="ctl">
    <label for="pow">击退</label>
    <input id="pow" type="range" min="0" max="16" step="0.5" value="7">
    <span id="powv">7.0</span>
  </div>
  <button id="auto">自动投弹</button>
  <button id="pause">暂停</button>
  <button id="reset">重来</button>
  <a href="index.html">基础图元</a>
  <a href="scenes.html">命中场景</a>
  <a href="sim.html">掉落压测</a>
  <a href="swing.html">水平挥砍</a>
  <a href="arena.html">竖劈竞技场</a>
  <a href="broad.html">宽阶段压测</a>
</header>
<main>
  <canvas id="c"></canvas>
  <div class="hud" id="hud"></div>
  <div class="tip">点一下画面 = 把炸弹丢到<b>鼠标指的地面位置</b>（拖动 = 转视角）</div>
</main>
<script src="wasm_exec.js?v=10"></script>
<script src="blast.js?v=10"></script>
</body>
</html>
