<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>starve · 碰撞检测可视化 (Go/WASM)</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #14161c; color: #e6e8ee;
    font: 13px/1.5 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex; flex-direction: column; height: 100vh;
  }
  header { padding: 10px 14px; border-bottom: 1px solid #262a35; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  h1 { font-size: 14px; margin: 0; font-weight: 600; }
  .modes { display: flex; gap: 6px; flex-wrap: wrap; }
  button {
    background: #222634; color: #cfd3dd; border: 1px solid #333a4a;
    padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 12px;
  }
  button:hover { background: #2a3040; }
  button.on { background: #2f6df6; border-color: #2f6df6; color: #fff; }
  .ctl { display: flex; gap: 8px; align-items: center; }
  input[type=range] { width: 140px; }
  main { flex: 1; position: relative; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
  .hud {
    position: absolute; left: 14px; bottom: 14px; background: #1b1f29cc;
    border: 1px solid #333a4a; border-radius: 8px; padding: 10px 12px; min-width: 230px;
    backdrop-filter: blur(4px);
  }
  .hud b { color: #7fd18b; }
  .hud .no { color: #ff7b72; }
  .hud small { color: #8b93a7; display: block; margin-top: 6px; }
</style>
</head>
<body>
<header>
  <h1>碰撞检测可视化 · Go + WASM</h1>
  <div class="modes" id="modes"></div>
  <div class="ctl">
    <label for="h">高度 Y</label>
    <input id="h" type="range" min="-1" max="4" step="0.05" value="1.5">
    <span id="hv">1.50</span>
  </div>
  <button id="view">视图：3D</button>
  <button id="reset">重置</button>
  <a href="scenes.html" style="color:#6ea8fe;text-decoration:none;font-size:12px">命中场景 →</a>
  <a href="sim.html" style="color:#6ea8fe;text-decoration:none;font-size:12px">掉落压测 →</a>
  <a href="swing.html" style="color:#6ea8fe;text-decoration:none;font-size:12px">挥砍扇形 →</a>
  <a href="broad.html" style="color:#6ea8fe;text-decoration:none;font-size:12px">宽阶段压测 →</a>
  <a href="arena.html" style="color:#6ea8fe;text-decoration:none;font-size:12px">竖劈竞技场 →</a>
</header>
<main>
  <canvas id="c"></canvas>
  <div class="hud" id="hud"></div>
</main>
<script src="wasm_exec.js?v=9"></script>
<script src="app.js?v=9"></script>
</body>
</html>
