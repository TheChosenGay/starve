name: Assets

# 按 configs/assets.lock.json 钉住的 commit 检出资产仓（asset-starve），
# 重算简化碰撞体并跑自动验收。三个触发点：
#   1. 资产仓的 collision-proxy 工作流自动开的 PR（pull_request）——合并前的硬门禁；
#   2. 本仓改动流水线/清单/生成物（push）；
#   3. 手动或外部 notification（workflow_dispatch / repository_dispatch）。
#
# 这样"美术改了模型但服务端没重跑流水线 / 没更新 pin"会在 CI 里直接红，
# 而不是等到有人肉眼看出来碰撞体不对。
#
# 需要在资产仓那边配一个 secret（见 asset-starve 仓的 .github/workflows/notify-server.yml）：
# 一个能对本仓发 repository_dispatch 的 PAT，存成 SERVER_DISPATCH_TOKEN。
# 资产仓若是私有仓库，还要给下面的 clone 配上带读权限的 token（用 ASSETS_TOKEN）。

on:
  workflow_dispatch:
  repository_dispatch:
    types: [assets-updated]
  # 资产仓的 collision-proxy 会开 PR 改这里；PR 上必须跑同一条硬门禁，
  # 否则自动生成的碰撞体在合并前没有验收。
  pull_request:
    paths:
      - "configs/models.json"
      - "configs/model_collision.json"
      - "configs/assets.lock.json"
      - "cmd/modelcollide/**"
      - "pkg/modelcollide/**"
      - ".github/workflows/assets.yml"
  push:
    paths:
      - "configs/models.json"
      - "configs/model_collision.json"
      - "configs/assets.lock.json"
      - "cmd/modelcollide/**"
      - "pkg/modelcollide/**"
      - ".github/workflows/assets.yml"

permissions:
  contents: read

concurrency:
  group: assets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 按 assets.lock.json 检出资产仓
        env:
          # 资产仓是公开仓时**不需要**这个 secret。只有确实要访问私有资产仓时才配，
          # 配错（值无效）会反而把匿名拉取也带坏——所以下面先匿名拉、失败才用它。
          ASSETS_TOKEN: ${{ secrets.ASSETS_TOKEN }}
        run: |
          set -euo pipefail
          repo=$(python3 -c "import json;print(json.load(open('configs/assets.lock.json'))['repo'])")
          sha=$(python3 -c "import json;print(json.load(open('configs/assets.lock.json'))['commit'])")

          # 没有 TTY，git 一旦碰到认证挑战只会抛 "could not read Username" 这种看不懂的错，
          # 所以先关掉交互提示，失败信息由下面自己给。
          export GIT_TERMINAL_PROMPT=0

          # 资产仓 530MB，而流水线只读 assets/models：blob:none 部分克隆 +
          # **稀疏检出**（只取 assets/models），把 CI 拉取量从 530MB 压到 ~116MB。
          # 注意 assetsDigest 走的是 git ls-tree（读对象库里的树，不含 blob），
          # 所以稀疏检出不影响 pin 的内容摘要计算。
          clone() {
            rm -rf /tmp/assets-repo
            git clone --filter=blob:none --no-checkout "$1" /tmp/assets-repo
            git -C /tmp/assets-repo sparse-checkout init --cone
            git -C /tmp/assets-repo sparse-checkout set assets/models
          }

          if ! clone "$repo" 2>/tmp/clone.err; then
            echo "匿名 clone 失败："; cat /tmp/clone.err
            if [ -n "${ASSETS_TOKEN:-}" ]; then
              echo "改用 ASSETS_TOKEN 重试（资产仓若是私有仓，这是必需的一步）"
              authed=$(printf '%s' "$repo" | sed "s#https://#https://x-access-token:${ASSETS_TOKEN}@#")
              if ! clone "$authed" 2>/tmp/clone.err; then
                echo "::error::带 ASSETS_TOKEN 也拉不到资产仓：token 无效或缺读取权限"
                cat /tmp/clone.err
                exit 1
              fi
            else
              echo "::error::拉不到资产仓 $repo"
              echo "公开仓不该拉不到（检查仓库是否存在/改名）；私有仓需要在**服务端仓**配 ASSETS_TOKEN（只读）"
              exit 1
            fi
          fi
          git -C /tmp/assets-repo checkout --detach "$sha"
          echo "资产仓 @ $sha"

      - name: 重算 + 自动验收（朝向 / 贴合 / 原点 / 居中 / 资产 pin）
        env:
          GATE_ASSET_ROOT: /tmp/assets-repo/assets
        run: go run ./cmd/modelcollide -verify -strict

      - name: 配置与流水线一致（不读模型，秒级）
        run: go run ./cmd/modelcollide -check
