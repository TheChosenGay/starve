name: Assets

# 按 configs/assets.lock.json 钉住的 commit 检出资产仓（asset-starve），
# 重算简化碰撞体并跑自动验收。三个触发点：
#   1. 资产仓的 collision-proxy 工作流自动开的 PR（pull_request）——合并前的硬门禁；
#   2. 本仓改动流水线/清单/生成物（push）；
#   3. 手动或外部 notification（workflow_dispatch / repository_dispatch）。
#
# 这样"美术改了模型但服务端没重跑流水线 / 没更新 pin"会在 CI 里直接红，
# 而不是等到有人肉眼看出来碰撞体不对。
#
# 需要在资产仓那边配一个 secret（见 asset-starve 仓的 .github/workflows/notify-server.yml）：
# 一个能对本仓发 repository_dispatch 的 PAT，存成 SERVER_DISPATCH_TOKEN。
# 资产仓若是私有仓库，还要给下面的 clone 配上带读权限的 token（用 ASSETS_TOKEN）。

on:
  workflow_dispatch:
  repository_dispatch:
    types: [assets-updated]
  # 资产仓的 collision-proxy 会开 PR 改这里；PR 上必须跑同一条硬门禁，
  # 否则自动生成的碰撞体在合并前没有验收。
  pull_request:
    paths:
      - "configs/models.json"
      - "configs/model_collision.json"
      - "configs/assets.lock.json"
      - "cmd/modelcollide/**"
      - "pkg/modelcollide/**"
      - ".github/workflows/assets.yml"
  push:
    paths:
      - "configs/models.json"
      - "configs/model_collision.json"
      - "configs/assets.lock.json"
      - "cmd/modelcollide/**"
      - "pkg/modelcollide/**"
      - ".github/workflows/assets.yml"

permissions:
  contents: read

concurrency:
  group: assets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 按 assets.lock.json 检出资产仓
        env:
          # 资产仓是**公开仓**时不需要这个 secret；是私有仓就必须配。
          # 典型失误：secret 建了但值是空的——那样等于没配（GitHub 对匿名请求返 401，
          # 表现为 "could not read Username ... terminal prompts disabled"）。
          ASSETS_TOKEN: ${{ secrets.ASSETS_TOKEN }}
        run: |
          set -uo pipefail
          repo=$(python3 -c "import json;print(json.load(open('configs/assets.lock.json'))['repo'])")
          sha=$(python3 -c "import json;print(json.load(open('configs/assets.lock.json'))['commit'])")
          echo "资产仓: $repo"; echo "pin:    $sha"; echo "git:    $(git --version)"

          # 没有 TTY：git 碰到认证挑战只会抛 "could not read Username" 这种看不懂的错
          export GIT_TERMINAL_PROMPT=0

          # 带 token 的 URL 有可能被 git 的错误信息原样回显（例如 not found）。
          # GitHub 本身会 mask secret 值，这里是第二道保险。
          scrub() {
            [ -n "${ASSETS_TOKEN:-}" ] || return 0
            sed "s#${ASSETS_TOKEN}#***#g" /tmp/err >/tmp/err.tmp 2>/dev/null \
              && mv /tmp/err.tmp /tmp/err || true
          }

          # 最快的一层：部分克隆（不拉 blob）+ 稀疏检出（只取 assets/models）。
          # 530MB → ~350MB；不能再细，因为漏登记扫描要扫整个 assets/models。
          sparse_attempt() {
            rm -rf /tmp/assets-repo
            git clone --filter=blob:none --no-checkout "$1" /tmp/assets-repo 2>/tmp/err || return 1
            git -C /tmp/assets-repo sparse-checkout init --cone 2>>/tmp/err || return 1
            git -C /tmp/assets-repo sparse-checkout set assets/models 2>>/tmp/err || return 1
            return 0
          }
          # 兜底层：全量克隆（不部分克隆、不稀疏）。慢，但尽量不因环境差异失败。
          full_attempt() {
            rm -rf /tmp/assets-repo
            git clone "$1" /tmp/assets-repo 2>/tmp/err || return 1
          }

          # 当前生效的访问 URL。私有仓下这是带 token 的形式，**必须一直留到 checkout 结束**：
          # 部分克隆在 checkout 时还会按需回源拉 blob，中途撤掉凭据会 401。
          url="$repo"
          ok=0
          : >/tmp/err
          sparse_attempt "$repo" && ok=1
          if [ "$ok" = 0 ] && [ -n "${ASSETS_TOKEN:-}" ]; then
            echo "::group::匿名拉取失败，改用 ASSETS_TOKEN 重试"
            scrub; cat /tmp/err || true
            echo "::endgroup::"
            url=$(printf '%s' "$repo" | sed "s#https://#https://x-access-token:${ASSETS_TOKEN}@#")
            : >/tmp/err
            sparse_attempt "$url" && ok=1
          fi
          if [ "$ok" = 0 ]; then
            echo "::group::稀疏/部分克隆失败，退回全量克隆"
            scrub; cat /tmp/err || true
            echo "::endgroup::"
            : >/tmp/err
            full_attempt "$url" && ok=1
          fi
          if [ "$ok" = 0 ]; then
            echo "::error::拉不到资产仓 $repo"
            scrub; cat /tmp/err || true
            if [ -z "${ASSETS_TOKEN:-}" ]; then
              echo "::error::匿名拉取被拒，而本仓没有配置可用的 ASSETS_TOKEN。"
              echo "  资产仓是私有仓时这是必须的（GitHub 对匿名请求返 401）："
              echo "    gh secret set ASSETS_TOKEN -R ${GITHUB_REPOSITORY:-TheChosenGay/starve}"
              echo "  值用一个 fine-grained PAT：仅授权 asset-starve，权限 Contents: Read-only。"
              echo "  或者把资产仓改成公开，公开仓不需要任何 secret。"
            else
              echo "::error::带 ASSETS_TOKEN 仍拉不到：token 无效、已过期，或缺 Contents 读权限。"
            fi
            exit 1
          fi

          # 检出 pin 住的 commit。部分克隆下按需拉 blob 偶发失败，重试一次并打印诊断。
          if ! git -C /tmp/assets-repo checkout --detach "$sha" 2>/tmp/err; then
            echo "::group::按 pin 检出失败，诊断"
            scrub; cat /tmp/err || true
            git -C /tmp/assets-repo branch -a | head -20 || true
            echo "::endgroup::"
            git -C /tmp/assets-repo fetch origin 2>&1 | tail -3 || true
            git -C /tmp/assets-repo checkout --detach "$sha" || {
              echo "::error::资产仓里没有 commit $sha —— pin 过时了（分支被删/被改）？跑 make assets-pin 重新钉。"
              exit 1
            }
          fi

          # blob 都落地了，现在才把 origin 换回干净地址：
          # 免得 token 留在 /tmp/assets-repo/.git/config 里被后续步骤或诊断命令带出来。
          if [ "$url" != "$repo" ]; then
            git -C /tmp/assets-repo remote set-url origin "$repo"
          fi
          echo "资产仓 @ $sha ✓"

      - name: 重算 + 自动验收（朝向 / 贴合 / 原点 / 居中 / 资产 pin）
        env:
          GATE_ASSET_ROOT: /tmp/assets-repo/assets
        run: go run ./cmd/modelcollide -verify -strict

      - name: 配置与流水线一致（不读模型，秒级）
        run: go run ./cmd/modelcollide -check
